- name: Allow CouchDB Infra access
  authorized_key:
    user: "{{ ansible_facts['user_id'] }}"
    state: present
    key: "{{ item }}"
  with_items:
    - https://github.com/davisp.keys
    - https://github.com/kocolosk.keys
    - https://github.com/nickva.keys
    - https://github.com/wohali.keys
    - https://github.com/big-r81.keys
    - https://github.com/janl.keys

- name: Lock root account
  become: yes
  user:
    name: root
    password_lock: true

- name: Disable password logins and root password logins over SSH
  become: yes
  copy:
    src: sshd-couchdb-ci.conf
    dest: /etc/ssh/sshd_config.d/00-couchdb-ci.conf
    owner: root
    group: root
    mode: 0644
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd

- name: Install basic ubiquitous packages
  become: yes
  apt:
    name: "{{ packages }}"
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  vars:
    packages:
      - ca-certificates
      - curl
      - git
      - mtr-tiny
      - nload
      - chrony
      - python3
      - screen
      - strace
      - sudo
      - tcpdump
      - tmux
      - vim
      - emacs-nox
      - wget
      - ripgrep
