# Handled by ansible (couchdb-infra-cm, roles/common)
#
# sshd uses the first value it sees for options
# etc/ssh/sshd_config includes sshd_config.d/*.conf
# the cloud-init / cloud image drop-ins (50-*.conf)
PermitRootLogin prohibit-password
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
